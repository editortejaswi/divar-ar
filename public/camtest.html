<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Camera Test</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #fff;
      font: 16px/1.5 system-ui, -apple-system, sans-serif; }
    #v { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #111; }
    #ui { position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column; gap: 16px;
      align-items: center; justify-content: center; text-align: center; padding: 24px; }
    button { font-size: 20px; font-weight: 800; padding: 16px 30px; border: 0; border-radius: 14px;
      background: #2fd47a; color: #04240f; }
    #out { position: fixed; left: 10px; right: 10px; bottom: 12px; z-index: 3;
      background: rgba(0,0,0,0.72); padding: 12px 14px; border-radius: 12px;
      font: 13px/1.5 ui-monospace, monospace; white-space: pre-wrap; }
  </style>
</head>
<body>
  <video id="v" playsinline muted autoplay></video>
  <div id="ui">
    <div>Camera isolation test<br />(no AR, no libraries)</div>
    <button id="b">Start camera</button>
  </div>
  <pre id="out"></pre>
  <script>
    var out = document.getElementById('out');
    var v = document.getElementById('v');
    function log(m) { out.textContent = m; }
    log('secureContext=' + window.isSecureContext
      + '\nhost=' + location.host
      + '\nmediaDevices=' + !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)
      + '\n\nTap "Start camera".');
    document.getElementById('b').onclick = function () {
      log('requesting camera\u2026');
      navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false })
        .then(function (stream) {
          v.srcObject = stream;
          var t = stream.getVideoTracks()[0];
          var s = t.getSettings ? t.getSettings() : {};
          document.getElementById('ui').style.display = 'none';
          v.play().then(function () {
            setTimeout(function () {
              log('OK \u2705 playing\ntrack=' + t.label
                + '\nsettings=' + JSON.stringify(s)
                + '\nvideo=' + v.videoWidth + 'x' + v.videoHeight + ' paused=' + v.paused);
            }, 700);
          }).catch(function (e) { log('PLAY FAILED \u274C ' + e.name + ': ' + e.message); });
        })
        .catch(function (e) { log('getUserMedia FAILED \u274C ' + e.name + ': ' + e.message); });
    };
  </script>
</body>
</html>
